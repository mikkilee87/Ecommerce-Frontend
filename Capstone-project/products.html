<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Pet Shop Products</title>
        <link rel="stylesheet" href="products.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Englebert&display=swap" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet"/>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    </head>
    <body>
        <header class="header">
            <a href="#" class="logo">
                <img src="Images and Logos/nature-pet-store.jpg" alt="pet store logo">
            </a>
            <nav class="navbar">
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="products.html">Products</a></li>
                    <li><a href="#">Cart</a></li>               
                    <li><a href="#">Contact Us</a> </li> 
                </ul>
            </nav>
            <div id="cart-icon">
                <i class="ri-shopping-cart-2-line"></i>
                <span class="cart-item-count"></span>
            </div>
        </header>
        <main>
            <!--Shop Content-->
            <section class="shop">
                <h1 class="section-title">Shop Products</h1>
                <div class="product-content">
                    <!-- Product 1 -->
                    <div class="product-box">
                        <div class="img-box">
                            <img src="placeholder" alt="">
                        </div>
                        <span class="category-tag">Dog Food</span>
                        <h2 class="product-title">Premium Dog Food</h2>
                        <span class="price">$54.99</span>
                        <div class="product-details">
                            <!-- Stock availability indicator -->
                            <span class="stock-status in-stock"><i class="ri-checkbox-circle-line"></i> In Stock</span>
                            <span class="items-left">25 available</span>
                            <div class="shipping-info">Free shipping over $50</div>
                        </div>
                        <div class="product-actions">
                            <a href="product.html" class="view-details-btn">View Details</a>
                            <!-- Add to cart button with quantity control -->
                            <div class="add-to-cart-container">
                                <div class="quantity-controls">
                                    <button class="quantity-btn quantity-minus">-</button>
                                    <span class="quantity">1</span>
                                    <button class="quantity-btn quantity-plus">+</button>
                                </div>
                                <button class="add-to-cart-btn">Add to Cart</button>
                            </div>
                        </div>
                    </div>

                    <!-- Product 2 -->
                    <div class="product-box">
                        <div class="img-box">
                            <img src="placeholder" alt="">
                        </div>
                        <span class="category-tag">Cat Furniture</span>
                        <h2 class="product-title">Cat Scratching Tree</h2>
                        <span class="price">$89.99</span>
                        <div class="product-details">
                            <!-- Stock availability indicator -->
                            <span class="stock-status in-stock"><i class="ri-checkbox-circle-line"></i> In Stock</span>
                            <span class="items-left">12 available</span>
                            <div class="shipping-info">Free shipping over $50</div>
                        </div>
                        <div class="product-actions">
                            <a href="product.html" class="view-details-btn">View Details</a>
                            <!-- Add to cart button with quantity control -->
                            <div class="add-to-cart-container">
                                <div class="quantity-controls">
                                    <button class="quantity-btn quantity-minus">-</button>
                                    <span class="quantity">1</span>
                                    <button class="quantity-btn quantity-plus">+</button>
                                </div>
                                <button class="add-to-cart-btn">Add to Cart</button>
                            </div>
                        </div>
                    </div>

                </div>
            </section>
        </main>
        <footer>
            <div class="social-icon-container">
                <a href="#"><i class="fa fa-facebook" aria-hidden="true"></i></a>
                <a href="#"><i class="fa fa-instagram" aria-hidden="true"></i></a>
                <a href="#"><i class="fa fa-linkedin" aria-hidden="true"></i></a>
                <a href="#"><i class="fa fa-vimeo" aria-hidden="true"></i></a>
                <a href="#"><i class="fa fa-behance" aria-hidden="true"></i></a>
            </div>
            <p>&copy;2025 Purrfect Pets. All rights reserved</p>
        </footer>
        <script src="products.js"></script>
    </body>
</html>
